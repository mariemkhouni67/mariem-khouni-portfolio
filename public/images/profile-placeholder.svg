<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050816" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="400" height="400" rx="200" fill="url(#bgGlow)" />

  <!-- Outer Glowing Orbital Ring -->
  <circle cx="200" cy="200" r="186" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" filter="url(#softGlow)" />
  <circle cx="200" cy="200" r="172" stroke="#6366F1" stroke-width="1.5" opacity="0.3" />

  <!-- Abstract Tech Grid Lines inside -->
  <path d="M120 70 L280 70 M90 140 L310 140 M80 200 L320 200 M90 260 L310 260 M120 330 L280 330" stroke="#06B6D4" stroke-width="1" opacity="0.12" />
  <path d="M140 80 L140 320 M200 60 L200 340 M260 80 L260 320" stroke="#6366F1" stroke-width="1" opacity="0.12" />

  <!-- Central Futuristic Monogram & Silhouette -->
  <!-- Stylized Head & Shoulders Silhouette -->
  <path d="M200 130 C220 130 236 146 236 166 C236 186 220 202 200 202 C180 202 164 186 164 166 C164 146 180 130 200 130 Z" fill="#6366F1" opacity="0.25" />
  <path d="M130 270 C130 230 162 216 200 216 C238 216 270 230 270 270 C270 276 266 280 260 280 L140 280 C134 280 130 276 130 270 Z" fill="#06B6D4" opacity="0.2" />

  <!-- Clean MK Monogram Center -->
  <text x="200" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="4">MK</text>
  <text x="200" y="248" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle" fill="#06B6D4" letter-spacing="2">MARIEM KHOUNI</text>
  <text x="200" y="268" font-family="ui-monospace, monospace" font-size="10" font-weight="500" text-anchor="middle" fill="#94A3B8" letter-spacing="1">SOFTWARE &bull; AI</text>

  <!-- Glowing Accent Dots -->
  <circle cx="200" cy="14" r="5" fill="#06B6D4" filter="url(#softGlow)" />
  <circle cx="386" cy="200" r="4" fill="#6366F1" filter="url(#softGlow)" />
  <circle cx="200" cy="386" r="5" fill="#8B5CF6" filter="url(#softGlow)" />
  <circle cx="14" cy="200" r="4" fill="#06B6D4" filter="url(#softGlow)" />
</svg>
